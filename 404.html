<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YKD9BTDEDB"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-YKD9BTDEDB');</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>ページが見つかりません｜スカイリー</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #ffffff; color: #1C2B33; font-family: "Noto Serif JP", "Hiragino Mincho ProN", serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  * { box-sizing: border-box; }
  a { color: #4276D2; text-decoration: none; }
  a:hover { color: #2E6BE6; }
  .cta { transition: background .2s ease, box-shadow .2s ease; }
  a.cta:hover { background: #2559c4; box-shadow: 0 8px 32px rgba(46,107,230,.3); }
</style>
<style>
  .menu-toggle { display: none; }
  .mobile-menu { display: none; }
  @media (max-width: 767px) {
    .nav-desktop { display: none !important; }
    .menu-toggle { display: inline-flex; align-items: center; justify-content: center; }
    .mobile-menu { flex-direction: column; padding: 8px 24px 20px; background: #ffffff; border-top: 1px solid #EDF0F2; }
    .mobile-menu.is-open { display: flex; }
    .mobile-menu a { padding: 14px 0; font-size: 16px; color: #1C2B33; border-bottom: 1px solid #F2F1EA; }
  }
</style>
</head>
<body>
<div style="max-width: 100%;">

  <header style="position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid #EDF0F2;">
    <div style="max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; gap: 24px;">
      <a href="/" style="font-family: Jost, sans-serif; font-weight: 500; font-size: 22px; letter-spacing: .14em; color: #1C2B33;">SKYLEE</a>
      <nav class="nav-desktop" style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 28px; font-size: 15px;">
        <a href="/#reason" style="color: #1C2B33;">選ばれる理由</a>
        <a href="/#service" style="color: #1C2B33;">サービス</a>
        <a href="/#about" style="color: #1C2B33;">代表挨拶</a>
      </nav>
      <button type="button" class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="mobileMenu" aria-label="メニューを開く" style="margin-left: auto; background: none; border: 1px solid #EDF0F2; border-radius: 10px; width: 44px; height: 40px; font-size: 20px; line-height: 1; color: #1C2B33; cursor: pointer;">☰</button>
    </div>
    <nav class="mobile-menu" id="mobileMenu">
      <a href="/#reason">選ばれる理由</a>
      <a href="/#service">サービス</a>
      <a href="/#about">代表挨拶</a>
    </nav>
  </header>

  <section style="padding: clamp(64px, 10vw, 140px) 24px;">
    <div style="max-width: 640px; margin: 0 auto; text-align: center;">
      <p style="margin: 0 0 12px; font-family: Jost, sans-serif; font-weight: 300; font-size: clamp(56px, 8vw, 96px); line-height: 1.1; letter-spacing: .02em; color: #4276D2;">404</p>
      <h1 style="margin: 0 0 20px; font-size: clamp(22px, 2.8vw, 30px); font-weight: 700;">お探しのページが見つかりません</h1>
      <p style="margin: 0 0 40px; font-size: 16px; line-height: 2; color: #46545E;">ページが移動または削除された可能性があります。<br>URLをご確認いただくか、トップページからお探しください。</p>
      <a href="/" class="cta" style="display: inline-flex; background: #2E6BE6; color: #ffffff; font-size: 17px; font-weight: 500; padding: 18px 36px; border-radius: 999px; box-shadow: 0 4px 24px rgba(46,107,230,.2);">トップページへ戻る</a>
    </div>
  </section>

  <footer style="padding: 48px 24px; border-top: 1px solid #EDF0F2;">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between;">
      <a href="/" style="font-family: Jost, sans-serif; font-weight: 500; font-size: 18px; letter-spacing: .14em; color: #1C2B33;">SKYLEE</a>
      <span style="font-family: Jost, sans-serif; font-size: 14px; color: #46545E;">© 2026 Skylee</span>
    </div>
  </footer>
</div>
<script>
(function(){
  var btn = document.getElementById('menuToggle');
  var menu = document.getElementById('mobileMenu');
  if (!btn || !menu) return;
  btn.addEventListener('click', function(){
    var open = menu.classList.toggle('is-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.textContent = open ? '✕' : '☰';
  });
  menu.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){
      menu.classList.remove('is-open');
      btn.setAttribute('aria-expanded', 'false');
      btn.textContent = '☰';
    });
  });
})();
</script>
</body>
</html>
